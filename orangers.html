<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O'Rangers — $ORNG</title>
<meta name="description" content="O'Rangers. One hundred pictures. Mint opens 2 November 2026.">
<link rel="icon" href="/img/mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3efe8;--ink:#1c1915;--mute:#6d645b;--line:#e4dcd0;--card:#fffdf9;--bar:#171310;--btc:#F7931A}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,sans-serif;font-size:16px;line-height:1.5}
a{color:inherit}
img{max-width:100%;height:auto}
.top{position:sticky;top:0;z-index:4;background:var(--bar);color:#f6f1ea}
.top-row{width:min(980px,100%);margin:0 auto;display:flex;align-items:center;gap:14px;padding:12px 16px;flex-wrap:wrap}
.brand{color:#E8590C;text-decoration:none;font-weight:800;font-size:13px;letter-spacing:.16em}
.brand .dol{color:#8d8278;font-weight:700;letter-spacing:0;margin-right:1px}
.links{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.links a{color:#a79c8e;text-decoration:none;font-size:13px;font-weight:700;padding:6px 10px;border-radius:999px}
.links a.on{color:#fff;background:rgba(247,147,26,.28)}
main{width:min(980px,100%);margin:0 auto;padding:28px 16px 48px}
h1{font-size:clamp(32px,6vw,48px);line-height:1.05;margin:0 0 12px;letter-spacing:-.03em}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:28px 0 10px}
.mint{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--btc);border-radius:14px;padding:16px 16px 14px;margin:18px 0 22px}
.mint h2{margin:0 0 8px;letter-spacing:0;text-transform:none;color:var(--ink);font-size:22px}
.mint p{margin:0 0 8px}
.mint p:last-child{margin:0}
.clock{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:clamp(26px,6vw,40px);font-weight:700;letter-spacing:.03em;font-variant-numeric:tabular-nums;margin:0 0 6px}
.when{color:var(--mute);font-size:13px;font-weight:700;margin:0 0 8px}
#rate,#mint-chain{color:var(--mute);font-size:14px}
#mint-fit,#mint-who{font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:0;border-radius:999px;padding:10px 14px;background:var(--ink);color:#fff;font-weight:800;cursor:pointer}
.btn.btc{background:var(--btc);color:#1c1915}
.pick[hidden]{display:none}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 12px}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:800;color:var(--mute)}
.filters select{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:8px 10px;font:600 14px Montserrat,sans-serif}
.count{color:var(--mute);font-size:13px;font-weight:700;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
.card{display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden;text-align:left;cursor:pointer;font:inherit;color:inherit}
.card img{display:block;width:100%;height:auto;image-rendering:pixelated;background:#1c1915}
.card span{display:block;padding:8px 10px 10px}
.card b{display:block;font-size:12px}
.card small{display:block;margin-top:3px;color:var(--mute);font-size:12px;font-weight:600;line-height:1.35}
.card.on{outline:2px solid var(--btc);outline-offset:1px}
.pick{display:grid;grid-template-columns:minmax(120px,220px) 1fr;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 16px}
.pick img{width:100%;image-rendering:pixelated;background:#1c1915;border-radius:10px}
.pick p{margin:0;font-weight:700}
.pick small{display:block;margin-top:6px;color:var(--mute);font-weight:600}
footer{width:min(980px,100%);margin:0 auto;padding:0 16px 32px;color:var(--mute);font-size:12px}
footer a{color:var(--ink);font-weight:700}
@media (max-width:640px){
  .pick{grid-template-columns:1fr}
  .links{margin-left:0}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <a class="brand" href="/" aria-label="ORNG home"><span class="dol">$</span>ORNG</a>
    <nav class="links">
      <a href="/">Home</a>
      <a href="/play.html">Play</a>
      <a href="/explore.html">Look</a>
      <a href="/orangers.html" class="on">O'Rangers</a>
      <a href="/trade.html">Trade</a>
      <a href="/faq.html">FAQ</a>
    </nav>
  </div>
</header>
<main>
  <h1>O'Rangers</h1>
  <section class="mint" aria-labelledby="mint-title">
    <h2 id="mint-title">Mint opens in</h2>
    <p class="clock" id="clock" role="timer">—</p>
    <p class="when" id="when">2 Nov 2026, 00:00 UTC</p>
    <p id="mint-note">Free if your wallet minted $ORNG. Otherwise $9 in bitcoin, or $7.20 in $ORNG.</p>
    <p id="rate"></p>
    <div id="mint-open" hidden>
      <div class="filters">
        <label>Head <select id="mhat" aria-label="Head"></select></label>
        <label>Glasses <select id="mglasses" aria-label="Glasses"></select></label>
        <label>Cloth color <select id="mcolor" aria-label="Cloth color"></select></label>
      </div>
      <div class="pick" id="mint-preview" hidden></div>
      <p id="mint-fit"></p>
      <p id="mint-chain">Nothing is sent from this page.</p>
      <div class="row" id="mint-connect"></div>
      <p id="mint-who"></p>
    </div>
  </section>
  <h2>The hundred</h2>
  <div class="filters">
    <label>Hat <select id="hat" aria-label="Hat"></select></label>
    <label>Glasses <select id="glasses" aria-label="Glasses"></select></label>
    <label>Cloth color <select id="color" aria-label="Cloth color"></select></label>
  </div>
  <p class="count" id="count"></p>
  <div id="pick"></div>
  <div class="grid" id="grid"></div>
</main>
<footer>Drawings, not inscriptions yet. <a href="/faq.html">Questions</a></footer>
<script src="/orangers.js"></script>
</body>
</html>

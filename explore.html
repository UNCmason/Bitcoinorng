<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Look · $ORNG</title>
<meta name="description" content="Look up CRC-20 coins, swaps, and wallets on Bitcoin. Plain words, live from the BONS launch list.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23F7931A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3efe8;--ink:#1c1915;--mute:#6d645b;--line:#e4dcd0;--card:#fffdf9;--bar:#171310;--btc:#F7931A;--green:#1f6b45;--red:#8d2f2f}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,sans-serif;font-size:16px;line-height:1.45}
a{color:inherit}
button,input{font:inherit}
.top{background:var(--bar);color:#f6f1ea;padding:14px 16px 16px}
.top-row{width:min(980px,100%);margin:0 auto;display:flex;align-items:center;gap:14px}
.brand{color:#fff;text-decoration:none;font-weight:800;letter-spacing:.04em}
.brand span{color:var(--btc)}
.links{margin-left:auto;display:flex;gap:6px}
.links a{color:#a79c8e;text-decoration:none;font-size:13px;font-weight:700;padding:6px 10px;border-radius:999px}
.links a.on{color:#fff;background:rgba(247,147,26,.28)}
.find{width:min(980px,100%);margin:14px auto 0;display:flex;gap:8px}
.find input{flex:1;min-width:0;border:0;border-radius:12px;padding:14px 16px;background:#fff;color:var(--ink);font-weight:500}
.find input:focus{outline:2px solid var(--btc)}
.find button{border:0;border-radius:12px;padding:0 18px;background:var(--btc);color:#1c1915;font-weight:800;cursor:pointer}
main{width:min(980px,100%);margin:0 auto;padding:22px 16px 64px}
h1{font-size:28px;line-height:1.15;margin:0 0 8px}
.lede{margin:0 0 16px;color:var(--mute);max-width:640px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .k{display:block;color:var(--mute);font-size:12px;font-weight:700}
.stat .v{display:block;margin-top:4px;font-weight:800;font-size:18px}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:22px 0 8px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--coin,#F7931A);border-radius:12px;padding:10px 12px;text-decoration:none}
.row p{margin:3px 0 0;color:var(--mute);font-size:13px}
.row .tick{font-weight:800;letter-spacing:.03em}
.pic{width:44px;height:44px;border-radius:10px;object-fit:cover;background:#1c1915;display:block}
.mark{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:#1c1915;font-weight:800;background:var(--coin,#F7931A)}
.side{text-align:right;font-weight:700;font-size:14px}
.side small{display:block;color:var(--mute);font-weight:500;font-size:12px}
.swap{display:block;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--coin,#F7931A);border-radius:12px;padding:12px 14px;text-decoration:none}
.swap b{display:block;font-size:15px;font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:6px;color:var(--mute);font-size:12px;font-weight:600}
.pill{border-radius:999px;padding:2px 8px;font-weight:800}
.pill.buy{background:#e5f2ea;color:var(--green)}
.pill.sell{background:#f8e8e4;color:var(--red)}
.hero{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--coin,#F7931A);border-radius:14px;padding:16px;margin:0 0 14px}
.hero p{margin:8px 0 0;font-size:18px;font-weight:700}
.head{display:flex;gap:14px;align-items:center}
.head img,.head .mark{width:72px;height:72px;border-radius:16px}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.86em;word-break:break-all}
.note{color:var(--mute);font-size:14px}
.warn{background:#fff4e8;border:1px solid #f0d2b0;border-radius:12px;padding:12px 14px}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--mute);font-size:12px}
.btn{display:inline-block;margin-top:14px;background:var(--ink);color:#fff;text-decoration:none;font-weight:700;border-radius:999px;padding:10px 14px}
footer{width:min(980px,100%);margin:0 auto;padding:0 16px 28px;color:var(--mute);font-size:12px}
@media (min-width:720px){.stats{grid-template-columns:repeat(4,1fr)}}
@media (max-width:640px){
  .top-row{flex-wrap:wrap}
  .links{margin-left:0}
  .row{grid-template-columns:44px 1fr}
  .side{grid-column:2;text-align:left}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <a class="brand" href="/"><span>$</span>ORNG</a>
    <nav class="links">
      <a href="/">Home</a>
      <a href="/play.html">Play</a>
      <a href="/explore.html" class="on">Look</a>
    </nav>
  </div>
  <form class="find" id="find">
    <input id="q" name="q" aria-label="Search a coin, a transaction, or a bc1 address" placeholder="Search a coin, a transaction, or a bc1 address" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off">
    <button type="submit">Search</button>
  </form>
</header>
<main id="app"><p class="note">Loading the coins…</p></main>
<footer>Figures come from the public BONS API, live. A coin’s color is taken from the picture on that launch. This page does not hold keys and does not send transactions. CRC-20 on Bitcoin is experimental.</footer>
<script src="/explore.js"></script>
</body>
</html>
